# CodeRabbit Configuration for Spring Boot Project
# This file configures CodeRabbit for automated code review
# 한국어 피드백 설정

# Enable features
review:
  enabled: true
  auto_approve: false
  max_review_commits: 50

test:
  enabled: true
  auto_approve: false

improve:
  enabled: true
  auto_approve: false

docs:
  enabled: true
  auto_approve: false

# Language specific settings
languages:
  java:
    enabled: true
    test_framework: junit
    framework: spring-boot
  kotlin:
    enabled: true
    test_framework: junit
    framework: gradle

# 한국어 피드백 설정
language: ko
feedback_style: korean

# Project specific settings
project:
  type: spring-boot
  build_tool: gradle
  java_version: 21
  spring_boot_version: 3.4.2

# File patterns to include/exclude
patterns:
  include:
    - "src/**/*.java"
    - "websocket/src/**/*.java"
    - "**/*.kt"
    - "build.gradle.kts"
    - "websocket/build.gradle.kts"
    - "compose.yml"
    - "Dockerfile"
    - "src/main/resources/application.yml"
    - "src/main/resources/application.properties"
    - "websocket/src/main/resources/application.yml"
  
  exclude:
    - "**/*.md"
    - "**/*.txt"
    - "**/test/**"
    - "**/build/**"
    - "**/.gradle/**"
    - "**/node_modules/**"
    - "**/target/**"
    - "**/.git/**"
    - "**/prometheus/**"

# Custom review prompts (한국어)
custom_prompts:
  review:
    - "모든 리뷰 코멘트는 한국어로 작성해주세요."
    - "Spring Boot 3.4.2 모범 사례를 준수하는지 확인해주세요."
    - "OAuth2, Spring Security 설정의 보안 취약점을 검토해주세요."
    - "JPA/Hibernate 사용 시 성능 최적화가 필요한 부분을 확인해주세요."
    - "Redis 캐싱이 적절히 구현되었는지 확인해주세요."
    - "WebSocket 모듈 분리로 인한 보안 설정이 올바른지 확인해주세요."
    - "Docker 컨테이너화가 적절히 구성되었는지 확인해주세요."
    - "Actuator 엔드포인트 보안이 적절히 설정되었는지 확인해주세요."
    - "코드 품질과 가독성을 중점적으로 검토해주세요."
    - "한국 개발자들이 이해하기 쉽게 설명해주세요."
  
  improve:
    - "모든 개선 제안은 한국어로 작성해주세요."
    - "Spring Boot 애플리케이션의 성능을 개선할 수 있는 방법을 제안해주세요."
    - "더 나은 설계 패턴을 적용할 수 있는 부분을 찾아주세요."
    - "코드 리팩토링이 필요한 부분을 제안해주세요."
    - "보안을 강화할 수 있는 방법을 제안해주세요."
    - "테스트 커버리지를 높일 수 있는 방법을 제안해주세요."
    - "한국 개발 환경에 맞는 최적화 방안을 제시해주세요."

# Repository settings (한국어)
repository:
  base_branch: main
  pr_title_template: "feat: {description}"
  pr_body_template: |
    ## 변경사항
    {changes}
    
    ## 리뷰 노트
    {review_notes}
    
    ## 테스트 체크리스트
    - [ ] 단위 테스트 통과
    - [ ] 통합 테스트 통과
    - [ ] 수동 테스트 완료
    - [ ] Docker 빌드 성공
    - [ ] Redis 캐시 정상 동작

# Security scanning (한국어)
security:
  enabled: true
  auto_approve: false
  scan_dependencies: true
  scan_code: true
  frameworks:
    - spring-boot
    - oauth2
    - websocket
    - redis
    - postgresql

# 한국어 피드백 스타일 설정
feedback:
  language: korean
  tone: friendly
  detail_level: comprehensive
  include_examples: true
  use_korean_terminology: true 